name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run database, API, failure and persistence tests
        env:
          JWT_SECRET: ci-only-\${{ github.run_id }}-\${{ github.run_attempt }}-replace-not-used-in-production
        run: npm test
