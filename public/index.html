<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karachi Bites - Menu</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .menu-item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; background: white; }
        .item-name { font-weight: bold; font-size: 1.2em; }
        .item-price { color: #e74c3c; font-weight: bold; }
        .tag { display: inline-block; padding: 4px 8px; margin: 4px; background: #eee; border-radius: 4px; font-size: 0.9em; }
        .add-btn { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .cart { position: fixed; top: 20px; right: 20px; background: #fff; border: 1px solid #ddd; padding: 15px; }
        .filters { margin-bottom: 20px; }
        .filter-btn { margin: 5px; padding: 5px 10px; border: 1px solid #ddd; cursor: pointer; }
        .filter-btn.active { background: #e74c3c; color: white; }
        .search-input { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Karachi Bites Menu</h1>
    <div class="filters">
        <input type="text" id="search" class="search-input" placeholder="Search menu items...">
        <div>
            <button class="filter-btn" onclick="filterByCategory('all')">All</button>
            <button class="filter-btn" onclick="filterByCategory('Biryani & Pulao')">Biryani</button>
            <button class="filter-btn" onclick="filterByCategory('Karahi & Curries')">Karahi</button>
            <button class="filter-btn" onclick="filterByCategory('Nihari & Haleem')">Nihari</button>
            <button class="filter-btn" onclick="filterByCategory('Paratha Rolls')">Paratha</button>
        </div>
        <div style="margin-top: 10px;">
            <label><input type="checkbox" id="vegetarian"> Vegetarian only</label>
            <label style="margin-left: 20px;"><input type="checkbox" id="spicy"> Spicy only</label>
        </div>
    </div>
    <div id="menu-container"></div>
    <div class="cart">
        <h3>Cart</h3>
        <div id="cart-items"></div>
        <p>Total: <span id="cart-total">0</span> PKR</div>
        <button onclick="checkout()">Checkout</button>
    </div>

    <script>
        const MOCK_MENU = [
            { id: 1, name: "Biryani", price: 350, category: "Biryani & Pulao", available: true, tags: ["spicy", "non-veg"] },
            { id: 2, name: "Karahi", price: 400, category: "Karahi & Curries", available: true, tags: ["spicy", "non-veg"] },
            { id: 3, name: "Nihari", price: 300, category: "Nihari & Haleem", available: true, tags: ["spicy", "non-veg"] },
            { id: 4, name: "Paratha", price: 150, category: "Paratha Rolls", available: true, tags: ["veg"] },
            { id: 5, name: "Samosa", price: 80, category: "Desserts & Beverages", available: true, tags: ["veg"] },
            { id: 6, name: "Lassi", price: 120, category: "Desserts & Beverages", available: true, tags: [] }
        ];

        let cart = JSON.parse(localStorage.getItem('karachi-cart') || '[]');
        let filters = {
            search: '',
            category: 'all',
            vegetarian: false,
            spicy: false,
            maxPrice: 0
        };

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            const filteredItems = applyFilters();

            filteredItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">PKR ${item.price}</div>
                    <div>${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">${item.available ? 'Add to Cart' : 'Out of Stock'}</button>
                `;
                container.appendChild(div);
            });

            if (filteredItems.length === 0) {
                container.innerHTML = '<p class="text-center py-8">No items found matching your filters</p>';
            }
        }

        function applyFilters() {
            let items = MOCK_MENU;

            // Search filter
            if (filters.search) {
                const searchLower = filters.search.toLowerCase();
                items = items.filter(item => item.name.toLowerCase().includes(searchLower));
            }

            // Category filter
            if (filters.category !== 'all') {
                items = items.filter(item => item.category === filters.category);
            }

            // Vegetarian filter
            if (filters.vegetarian) {
                items = items.filter(item => item.tags.includes('veg'));
            }

            // Spicy filter
            if (filters.spicy) {
                items = items.filter(item => item.tags.includes('spicy'));
            }

            // Price filter
            if (filters.maxPrice > 0) {
                items = items.filter(item => item.price <= filters.maxPrice);
            }

            return items;
        }

        function addToCart(itemId) {
            const item = MOCK_MENU.find(i => i.id === itemId);
            if (!item || !item.available) return;

            const existing = cart.find(i => i.id === itemId);
            if (existing) {
                existing.qty = (existing.qty || 0) + 1;
            } else {
                cart.push({ id: itemId, qty: 1 });
            }
            localStorage.setItem('karachi-cart', JSON.stringify(cart));
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const itemData = MOCK_MENU.find(i => i.id === item.id);
                if (itemData) {
                    const div = document.createElement('div');
                    div.innerHTML = `${itemData.name} x${item.qty} - PKR ${itemData.price * item.qty}`;
                    container.appendChild(div);
                    total += itemData.price * item.qty;
                }
            });
            document.getElementById('cart-total').textContent = total;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Please add items to cart');
                return;
            }
            // In real app, this would submit to API
            alert('Order placed! Redirecting to order page...');
            window.location.href = '/order-placed.html';
        }

        // Filter event listeners
        document.getElementById('search').addEventListener('input', (e) => {
            filters.search = e.target.value.trim();
            renderMenu();
        });

        document.getElementById('vegetarian').addEventListener('change', (e) => {
            filters.vegetarian = e.target.checked;
            renderMenu();
        });

        document.getElementById('spicy').addEventListener('change', (e) => {
            filters.spicy = e.target.checked;
            renderMenu();
        });

        function filterByCategory(category) {
            filters.category = category;
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderMenu();
        }

        renderMenu();
        updateCart();
    </script>
</body>
</html>
