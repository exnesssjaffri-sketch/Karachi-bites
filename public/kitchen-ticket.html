<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Karachi Bites — Kitchen Ticket</title><style>
body{margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#171717;background:#f5f5f5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:0 auto 20px;max-width:560px}button,a{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid #333;background:#fff;color:#111;text-decoration:none;cursor:pointer}#message{max-width:560px;margin:0 auto 16px;padding:12px;border-radius:6px;background:#eee}#ticket{max-width:560px;margin:0 auto;background:#fff;border:1px solid #ddd;padding:24px}#ticket h1{margin:0 0 4px;font-size:24px}.muted{color:#555;font-size:13px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0;padding:12px 0;border-block:1px dashed #777}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #ddd}.qty{text-align:right;width:64px}.notes{padding:12px;background:#f4f4f4;white-space:pre-wrap;overflow-wrap:anywhere}@media print{@page{size:auto;margin:10mm}body{padding:0;background:#fff}.toolbar,#message{display:none!important}#ticket{max-width:none;border:0;padding:0;margin:0}.notes{border:1px solid #aaa;background:#fff}*{color:#000!important;box-shadow:none!important}}</style></head><body><div class="toolbar"><a href="/admin">Back to staff console</a><button id="printButton" type="button" disabled>Print kitchen ticket</button></div><p id="message" role="status" aria-live="polite">Loading ticket…</p><main id="ticket" aria-busy="true"></main><script src="/js/kitchen-ticket.js"></script></body></html>
